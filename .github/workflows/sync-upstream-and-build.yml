# .github/workflows/sync-upstream-and-build.yml
#
# Lives in YOUR fork of Sukecz/esp32-birdnet-mic.
#
# MANUAL ONLY. There is no schedule: nothing runs until you press
# Actions -> sync-upstream-and-build -> Run workflow.
#
# What a run does:
#   1. Takes the upstream tag you typed in (default v1.34).
#   2. Merges it into your branch if it isn't already there.
#   3. Refuses to continue if your custom pins (WS=D2, SD=D10) are missing,
#      or if the sketch version doesn't match the tag.
#   4. Compiles for XIAO ESP32-C6 with upstream's own tools/compile_firmware.sh
#      (this is what turns on LTO for C3/C6 so the image fits the original
#      1,310,720-byte OTA slot).
#   5. Fails if the image doesn't fit; warns if headroom is under 8 KB.
#   6. Publishes firmware-app-c6.bin as a Release on YOUR fork.
#
# Then download the .bin from your fork's Releases page and upload it through
# birdbox2.5's own Web UI at http://<device-ip>/ota -> "Upload compiled file".
# Do NOT use the device's "Automatic update" button: it installs the stock-pin
# build and the microphone will go silent.
#
# LIMIT: use tags up to v1.34 only. v1.35 and later need upstream's pin-less
# bridge and a partition rewrite on the device (see the guard below).
#
# If the merge ever fails with a conflict in a real source file:
#   git fetch upstream --tags && git merge <tag>
# fix the conflict (check the I2S pin lines), push, then re-run.

name: sync-upstream-and-build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to build (v1.34 is the last one that fits the original OTA slot)'
        type: string
        default: 'v1.34'
      force_newer:
        description: 'Allow tags newer than v1.34 (only if you have USB access and know the partition caveats)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history - needed to merge against upstream tags

      - name: Configure git identity for the bot commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote and fetch tags
        run: |
          git remote add upstream https://github.com/Sukecz/esp32-birdnet-mic.git
          git fetch upstream --tags

      - name: Validate the requested tag
        id: target
        env:
          TAG: ${{ github.event.inputs.tag }}
          FORCE_NEWER: ${{ github.event.inputs.force_newer }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag '${TAG}' does not exist upstream."
            exit 1
          fi
          # Version-sort guard: anything above v1.34 needs the v1.35 bridge and a
          # partition rewrite on the device, and the bridge is built with stock pins.
          NEWEST_OK=$(printf '%s\n%s\n' "${TAG}" "v1.34" | sort -V | tail -1)
          if [ "${NEWEST_OK}" != "v1.34" ] && [ "${FORCE_NEWER}" != "true" ]; then
            echo "::error::${TAG} is newer than v1.34. Re-run with 'force_newer' ticked only if you intend to go through the v1.35 bridge / Prepare device path."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Building ${TAG}"

      - name: Merge the tag into your branch
        # If the merge conflicts ONLY in .github/workflows/ files, keep your
        # versions automatically. Any other conflict fails loudly so you can
        # resolve it by hand instead of building something wrong.
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          if git merge-base --is-ancestor "${TAG}" HEAD; then
            echo "${TAG} is already in your branch - no merge needed."
            exit 0
          fi
          if ! git merge --no-edit "${TAG}"; then
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            echo "Conflicted files:"
            echo "$CONFLICTS"
            OTHER=$(echo "$CONFLICTS" | grep -v '^\.github/workflows/' || true)
            if [ -n "$CONFLICTS" ] && [ -z "$OTHER" ]; then
              echo "Only workflow files conflicted - keeping your versions."
              echo "$CONFLICTS" | while read -r f; do
                git checkout --ours -- "$f"
                git add -- "$f"
              done
              git commit --no-edit
            else
              echo "::error::Merge conflict in a real source file pulling ${TAG}. Resolve locally: git fetch upstream --tags && git merge ${TAG}, fix the conflict (check your I2S pin lines), push, then re-run this workflow."
              exit 1
            fi
          fi

      - name: Keep upstream's own CI workflows out of the pushed commit
        # GITHUB_TOKEN cannot push changes under .github/workflows/, so put every
        # file there back to what is already live on origin/main.
        run: |
          for f in $(git diff --name-only origin/main HEAD -- .github/workflows/); do
            if git cat-file -e "origin/main:$f" 2>/dev/null; then
              git checkout origin/main -- "$f"
            else
              git rm -f -- "$f"
            fi
          done
          git commit -m "Exclude upstream's CI workflows from this fork" || echo "No workflow changes to exclude this run"

      - name: Guard - custom pins and version must be right
        # A wrong-pin build flashes fine and then records silence, so check
        # before spending build time.
        run: |
          set -euo pipefail
          INO=esp32-birdnet-mic/esp32-birdnet-mic.ino
          TAG="${{ steps.target.outputs.tag }}"
          # Only the XIAO block (the first match of each pin) is yours to override.
          grep -q '^static constexpr int I2S_LRCLK_PIN = D2;' "$INO" || { echo "::error::Custom WS pin (D2) missing from the XIAO pin block."; exit 1; }
          grep -q '^static constexpr int I2S_DOUT_PIN = D10;' "$INO" || { echo "::error::Custom SD pin (D10) missing from the XIAO pin block."; exit 1; }
          grep -q '^static constexpr int I2S_BCLK_PIN = D3;' "$INO"  || { echo "::error::BCLK is not D3 as expected."; exit 1; }
          WANT="${TAG#v}"
          HAVE=$(sed -n 's/^#define FW_VERSION "\(.*\)"/\1/p' "$INO" | head -1)
          echo "Sketch FW_VERSION=${HAVE}, requested tag=${WANT}"
          [ "$HAVE" = "$WANT" ] || { echo "::error::Sketch says ${HAVE} but you asked for ${WANT}."; exit 1; }

      - name: Read upstream's pinned toolchain versions
        # Follows whatever the merged tree pins in build-dependencies.json.
        id: deps
        run: |
          echo "cli=$(python3 -c "import json;print(json.load(open('build-dependencies.json'))['arduino_cli'])")" >> "$GITHUB_OUTPUT"
          cat build-dependencies.json

      - name: Set up Arduino CLI (pinned version)
        uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ steps.deps.outputs.cli }}

      - name: Install pinned ESP32 core and libraries
        run: python3 tools/check_build_dependencies.py --install

      - name: Compile for XIAO ESP32-C6 (upstream helper, LTO on)
        # compile_firmware.sh adds -flto for C3/C6 and uses its own build path.
        run: |
          chmod +x tools/compile_firmware.sh
          tools/compile_firmware.sh --fqbn esp32:esp32:XIAO_ESP32C6

      - name: Prepare release asset and check size
        run: |
          set -euo pipefail
          BIN=$(find esp32-birdnet-mic/build -type f -name 'esp32-birdnet-mic.ino.bin' | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::App binary not found. Build output:"
            find esp32-birdnet-mic/build -maxdepth 3 -type f | head -50
            exit 1
          fi
          echo "Using $BIN"
          cp "$BIN" firmware-app-c6.bin
          LIMIT=1310720
          SIZE=$(stat -c%s firmware-app-c6.bin)
          ROOM=$((LIMIT - SIZE))
          echo "firmware-app-c6.bin: ${SIZE} bytes, headroom under ${LIMIT}: ${ROOM} bytes"
          if [ "$ROOM" -lt 0 ]; then
            echo "::error::Image is ${SIZE} bytes, larger than the original ${LIMIT}-byte OTA slot. Do not flash."
            exit 1
          fi
          if [ "$ROOM" -lt 8192 ]; then
            echo "::warning::Only ${ROOM} bytes of headroom in the OTA slot."
          fi
          sha256sum firmware-app-c6.bin | tee firmware-app-c6.bin.sha256

      - name: Push merged source to your fork
        run: git push origin HEAD:main

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ steps.target.outputs.tag }}
          name: birdbox2.5 build (upstream ${{ steps.target.outputs.tag }})
          body: |
            Built from Sukecz/esp32-birdnet-mic ${{ steps.target.outputs.tag }}
            with your custom I2S pin overrides (WS -> D2, SD -> D10) verified,
            using upstream's pinned toolchain and LTO helper.

            Download firmware-app-c6.bin below and upload it at
            http://<birdbox2.5-ip>/ota -> "Upload compiled file".
            Do not use "Automatic update" - it installs the stock-pin build.
          files: |
            firmware-app-c6.bin
            firmware-app-c6.bin.sha256
